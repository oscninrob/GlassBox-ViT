[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glassbox-vit"
version = "0.1.0"
description = "Explainability and model-analysis toolkit for Vision Transformers"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.1,<3",
    "torch>=2.11,<3",
    "torchvision>=0.26,<1",
    "Pillow>=11,<12",
    "matplotlib>=3.10,<4",
    "opencv-python>=5,<6",
    "tqdm>=4.67,<5",
    "scikit-image>=0.25,<1",
    "scikit-learn>=1.6,<2",
    "transformers>=5.13,<6",
    "captum>=0.9,<1",
    "grad-cam>=1.5,<2",
    "lime==0.2.0.1",
    "shap>=0.52,<1",
]

[tool.setuptools.packages.find]
include = ["glassbox_vit*"]
